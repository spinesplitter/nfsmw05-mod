AccelerateRest=0
BrakeRest=0
SpeedSensitiveSteering=1
SeatForward=key:W,joy0:b33,joy1:b33
SeatBack=key:S,joy0:b31,joy1:b31
SeatLeft=key:A
SeatRight=key:D
SeatUp=joy1:b32
SeatDown=joy1:b30
SeatReset=key:RALT
SteeringSensitivity=1
SpeedSensitivity=0.6
ToggleAbs=joy0:b6,joy1:b6
