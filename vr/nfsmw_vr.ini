; NFS Most Wanted VR settings. Keep this file next to nfsmw_vr.asi (or d3d9.dll).
[VR]
GameMirrors=1
; 0 = act as a plain d3d9.dll (no VR)
Enabled=1
; Save nfsmw_crash.dmp + nfsmw_crash.txt locally after an unhandled game crash.
; Requires nfsmw_crashdump.exe next to speed.exe. No upload; latest crash replaces the files.
CrashDumps=1
ForceWindowed=1
DisableVSync=1
; OpenXR runtimes without 32-bit support (SteamVR) run through nfsmw_vr_host.exe.
; auto = use it when the active runtime has no 32-bit version, 1 = always, 0 = never
Bridge=auto

; Per-eye render resolution: auto = headset's recommended size, game = in-game setting,
; or e.g. 2016x2112. ResolutionScale multiplies "auto" (e.g. 0.8 for more fps).
Resolution=auto
ResolutionScale=1.0

; Multiplies head movement (1.0 = real-world scale)
WorldScale=1.0
; How much of the car's body roll / pitch to remove from your view (0..1)
LevelRoll=1.0
LevelPitch=0.0
; >1.0 renders a little beyond the headset FOV (softer image, more margin)
FovScale=1.0
; Near clip plane in metres: lower it if the dashboard, wheel or pillars close to your eyes get
; cut off. Very small values can make distant surfaces flicker. 0 = the game's own. Also in F4 > VR.
NearZ=0.091
; Seated: your car uses NearZ in its own part of the depth buffer, the world WorldNearZ (less z-fighting far away). 0 = off
DepthSplit=1
WorldNearZ=0.3

; Menu/movie screen and in-game HUD panel, in metres
ScreenDistance=2.5
ScreenWidth=3.0
HudDistance=1.2
HudWidth=1.4
HudHeight=-0.05

; Desktop window: smooth = stabilised headset view, sbs = both eyes side by side, eye = raw mirror
SpectatorMode=smooth
; 0 = match the headset. For 16:9 recordings try SpectatorFov=100, SpectatorAspect=1.7778
SpectatorFov=0
SpectatorAspect=0
SpectatorWidth=1600
; Head smoothing in seconds; FollowHead=0 locks the view straight ahead
SpectatorSmoothing=0.2
SpectatorFollowHead=1

; Cockpit: in the bumper and hood cameras you sit in the driver's seat (at the driver model's
; head), and the driver's head is left out of your view. HeadSize = how far down from the top of
; the driver model is cut away (m).
Seat=1
HideHead=1
HeadSize=0.25

; Virtual-key codes: F6 = 117, F7 = 118, F8 = 119
KeySpectator=117
KeyLevel=118
KeyRecenter=119
; Debug: pressing this key writes the left/right/HUD images to vr_dump_NNN_*.bmp next to speed.exe
KeyDump=0
; Debug key: F11 flips which views the second eye re-renders
KeyToggleShared=0
SharedViewsOnce=1
; Performance: environment map faces refreshed per frame (1..6; 6 = all every frame, as the game does)
EnvMapFacesPerFrame=2
; Performance: rear view (mirrors) rendered every Nth frame (1 = every frame)
RearViewEvery=1
; Performance: sun shadow map drawn once a frame for both eyes (checked every frame; off by itself if the eyes ever differ)
SharedShadows=1
; Performance: shadow map coverage around you (1 = the game's ~350 m square)
ShadowArea=0.75
; Performance: hand frames to the headset without waiting for the hand-over
AsyncSubmit=1
; Smaa: 0 off, 1 low, 2 medium, 3 high, 4 ultra. Anisotropic: 0 off, 1 2x, 2 4x, 3 8x, 4 16x. Also in F4 > Menu and testing
Anisotropic=0
; Debug: every 5 s, list how often the game binds each render target in one frame
LogPasses=0
; Seat adjustment (held), saved per car in [Seat] below: numpad 8/2 forward/back, 4/6 left/right,
; 9/3 up/down, 5 back to the driver's head
KeySeatForward=104
KeySeatBack=98
KeySeatLeft=100
KeySeatRight=102
KeySeatUp=105
KeySeatDown=99
KeySeatReset=101
